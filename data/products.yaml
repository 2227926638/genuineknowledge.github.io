  name_en: "Enterprise HaiTun Agent"
  desc: "面向企业的通用智能体平台。基于本体知识底座构建，让Agent在真实业务里靠谱落地：理解复杂指令、调用企业系统、自主完成任务，且过程可追溯、输出可审计。适合对安全与可控要求高的企业场景。"
  desc_en: "An enterprise-grade general-purpose agent platform built on the ontology knowledge foundation. It makes Agents reliable in real business: understanding complex instructions, calling enterprise systems, and completing tasks autonomously — with traceable processes and auditable outputs. Built for enterprises with high security and control requirements."
  features:
    - "通用智能体平台，适配全行业复杂业务流程"
    - "本体加持，每一步决策有据可查"
    - "自主完成任务，结果可靠、可审计"
    - "企业级部署，数据与权限可控"
  features_en:
    - "General-purpose agent platform for complex workflows across industries"
    - "Ontology-powered: every decision is traceable"
    - "Autonomous task completion, reliable and auditable results"
    - "Enterprise-grade deployment with controlled data and permissions"
  image: "/images/product4.png"

