  btnText: "了解更多"
  btnText_en: "Learn More"
  btnLink: "https://www.genuineknowledge.cn/haitun/"

- id: 3
  name: "本体系統"
  name_en: "Ontology System"
  desc: "真知自研的结构化知识底座。让本体与大模型双驱动：知识用本体显式组织、可审计可追溯，大模型负责理解与生成。落地8项能力——本体增强、大模型生成、混合检索、提示词工程、执行器编排、上下文管理、智能体记忆、规划器。让AI的每次判断有据可依、可解释。"
  desc_en: "Genuine Knowledge's self-developed structured knowledge foundation. Ontology and LLMs work in tandem: knowledge is explicitly organized, auditable, and traceable via ontology, while LLMs handle understanding and generation. It delivers 8 capabilities — ontology enhancement, LLM generation, hybrid retrieval, prompt engineering, executor orchestration, context management, agent memory, and planning — so every AI decision is grounded and explainable."
  features:
    - "显式知识图谱，决策有据可查，告别黑箱"
    - "本体与大模型双驱动，记忆不丢失、理解更准"
    - "可靠+可解释，适合对准确性要求高的2B/2G场景"
    - "可独立部署，亦可作为插件嵌入Agent"
  features_en:
    - "Explicit knowledge graphs, traceable decisions — no more black box"
    - "Ontology + LLM dual drive: no memory loss, better understanding"
    - "Reliable and explainable, ideal for accuracy-critical B2B/B2G scenarios"
    - "Deployable standalone or embeddable into Agents as a plugin"
  image: "/images/product3.png"

